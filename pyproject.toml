[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "queuesense"
version = "1.0.0"
description = "Fixed-camera queue and service-time measurement for one counter."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "QueueSense"}]

[project.scripts]
queuesense = "queuesense.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"
